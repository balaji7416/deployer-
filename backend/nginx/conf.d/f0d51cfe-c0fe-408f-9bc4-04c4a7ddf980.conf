
        server {
            listen 80; 

            server_name localhost;

            location /f0d51cfe-c0fe-408f-9bc4-04c4a7ddf980/ {
                proxy_pass http://container-f0d51cfe-c0fe-408f-9bc4-04c4a7ddf980:80/; 
                
                proxy_set_header Host $host; 
                proxy_set_header X-Real-IP $remote_addr; 
