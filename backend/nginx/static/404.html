<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      @keyframes slide-in-from-left {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(0);
        }
      }

      .slide {
        animation: slide-in-from-left 1s ease-in-out;
      }

      .terminal {
        font-family: monospace;
        background-color: black;
        color: green;
        padding: 20px;
        border-radius: 10px;
      }

      ul {
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .container {
        background-color: black;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        height: 100vh;
        padding: 20px;
      }

      h1 {
        color: green;
        font-family: monospace;
        text-align: center;
        font-size: 5rem;
        margin-bottom: 10px;
      }

      .terminal h1 {
        font-size: 1.2rem;
        margin-bottom: 8px;
      }

      .terminal div {
        margin-bottom: 4px;
      }

      .terminal ul li {
        margin-bottom: 2px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>404</h1>
      <div class="terminal slide">
        <h1>The Page your looking for is not found, try again later</h1>
        <div>Possible reasons:</div>
        <ul>
          <li>1. The Deployment is no longer available</li>
          <li>2. Server side error</li>
        </ul>
      </div>
    </div>
  </body>
</html>
